name: CI

on:
  push:
    branches:
      - main
      - dev
      - feature/*
      - bugfix/*
      - hotfix/*
      - release/v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format . --line-length=120 --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        timeout-minutes: 15
        # Far from UTC, so a day printed in the local zone where the app means UTC (Settings' published day) differs
        # from the UTC one and fails a test; UTC+14 puts most instants on the next day (plan 4.5).
        env:
          TZ: Pacific/Kiritimati
        run: flutter test --coverage --concurrency=4 --reporter=compact

      - name: Check coverage threshold
        # Excludes generated/bootstrap code from the metric (see scripts/check_coverage.sh, issue #149).
        run: scripts/check_coverage.sh coverage/lcov.info 90

  build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build APK
        run: flutter build apk --release --target lib/main/main_prod.dart

      # The Kotlin scrubber of native Sentry events and breadcrumbs (android/app/src/test). The APK build above wrote
      # the Gradle wrapper.
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -Ptarget=lib/main/main_prod.dart --console=plain

      # Review 8, finding 18: a bundle without android/key.properties stops on every machine but CI.
      - name: A bundle without the upload key stops
        working-directory: android
        run: |
          if CI=false ./gradlew :app:bundleRelease -Ptarget=lib/main/main_prod.dart --dry-run --console=plain > guard.log 2>&1; then
            cat guard.log
            exit 1
          fi
          grep -q 'android/key.properties is missing' guard.log

      # With a DSN, as a store build has (scripts/run_build.sh), so the Gradle file's DSN branch is built too. The DSN is
      # a made-up one; the bundle is only built.
      - name: Build App Bundle
        run: >-
          flutter build appbundle --release --target lib/main/main_prod.dart
          --dart-define=SENTRY_DSN=https://0123abcd@o1.ingest.example.invalid/4567

      - name: The native SDK has the DSN
        run: >-
          grep -q 'SENTRY_DSN = "https://0123abcd@o1.ingest.example.invalid/4567"'
          build/app/generated/source/buildConfig/release/dev/lokumai/bazaar/BuildConfig.java

  build-ios:
    name: Build iOS
    # The only iOS gate: no Linux host can build for Apple.
    runs-on: macos-15
    needs: [analyze, test]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # No DEVELOPMENT_TEAM is set, so the build is unsigned. Every plugin is a Swift package (no CocoaPods).
      - name: Build iOS
        run: flutter build ios --no-codesign --target lib/main/main_prod.dart
