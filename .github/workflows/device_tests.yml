name: Device tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test -d emulator-5554 --reporter expanded

  ios:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r, l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run the device tests on the simulator
        run: flutter test integration_test -d "${{ steps.simulator.outputs.udid }}" --reporter expanded
