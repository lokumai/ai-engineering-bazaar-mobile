name: ai_engineering_bazaar
description: "AI Engineering Bazaar reader for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

# ➜  ai_engineering_bazaar git:(main) ✗ flutter --version
# Flutter 3.47.7 • channel stable • https://github.com/flutter/flutter.git
# Framework • revision abaf9c5237 (12 days ago) • 2026-10-08 09:51:21 -0700
# Engine • hash d8a2d6c768c334d53e16277f837970ffa1e2de81 (revision deb287481e) (12 days ago) • 2026-10-07 17:09:12.000Z
# Tools • Dart 3.13.5 • DevTools 2.60.0
environment:
  sdk: ^3.13.5
  flutter: '3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: 9.1.1
  go_router: 18.1.1
  equatable: 3.0.0
  intl: 0.20.3
  bloc_concurrency: 0.3.0
  clock: 1.1.3
  logger: 2.8.0
  url_launcher: 6.3.3
  package_info_plus: 10.2.2
  crypto: 3.0.7
  sentry_flutter: 10.1.0
  http: 1.6.0
  path_provider: 2.1.6
  flutter_svg: 2.3.0
  path_parsing: 1.1.0
  file_picker: 13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  bloc_test: 10.0.0
  mocktail: 1.0.5
  fake_async: 1.3.3
  alchemist: 0.14.1
  intl_utils: 2.8.17 # discontinued upstream; still works on Dart 3.13 (see docs/upgrade_flutter_3.47.7.md)
  sentry: 10.1.0 # the version sentry_flutter pins; tests build options with an Android platform from its src
  dart_style: 3.1.14
  pub_semver: 2.2.1
  vector_graphics_compiler: 1.3.2

flutter_intl:
  enabled: true
  template-arb-file: lib/l10n/intl_en.arb
  output-localization-file: l10n.dart
  output-class: S

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/content/objects/
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Fraunces.txt
    - assets/brand/lokum_logo.webp
    - assets/app_icon/dark.png
    - assets/app_icon/cream.png
    - assets/app_icon/noir.png
    - assets/app_icon/ink.png
    - assets/app_icon/nightGold.png
    - assets/app_icon/nightSea.png
    - assets/welcome/cast_mihri.webp
    - assets/welcome/cast_dariush.webp
    - assets/welcome/cast_bit.webp
    - assets/welcome/cast_mei.webp
    - assets/welcome/cast_piri.webp
    - assets/about/grain.png
    - assets/about/scene_1.webp
    - assets/about/scene_1_still.webp
    - assets/about/scene_2.webp
    - assets/about/scene_2_still.webp
    - assets/about/scene_3.webp
    - assets/about/scene_3_still.webp
    - assets/about/scene_4.webp
    - assets/about/scene_4_still.webp
    - assets/about/scene_5.webp
    - assets/about/scene_5_still.webp
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        # The bold face of the same release (33.003), so a Persian heading at 600 or 700 is drawn bold, not thickened.
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
